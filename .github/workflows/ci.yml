name: CI
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m unittest discover -s kindle-display
        env:
          DATA_DIR: /tmp/kindleglance-tests
      - run: python -m unittest discover -s tools/codex-collector
      - run: python tools/test_plugin.py
      - run: sudo apt-get update && sudo apt-get install -y lua5.1 lua-sec lua-socket
      - run: python tools/test_tls_live.py
      - run: python tools/check_public.py
      - run: python tools/build_public_release.py
      - uses: actions/upload-artifact@v4
        with:
          name: release-candidate
          path: dist/
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: docker compose up -d --build --wait
      - run: docker compose cp board:/app/data/setup-code.json /tmp/setup-code.json
      - run: python tools/smoke_install.py --code-file /tmp/setup-code.json
      - run: docker compose restart && docker compose exec -T board python -m app.manage check
      - name: Restore a disposable installation from its complete data backup
        run: |
          docker compose stop board
          docker compose cp -a board:/app/data /tmp/board-backup
          docker compose down -v
          docker compose create board
          docker compose cp -a /tmp/board-backup/. board:/app/data
          docker compose up -d --wait
          docker compose exec -T board python -m app.manage check
          docker compose cp board:/app/data/credentials.json /tmp/restored-credentials.json
          cmp /tmp/board-backup/credentials.json /tmp/restored-credentials.json
          curl --fail http://127.0.0.1:3001/api/ready
      - run: docker compose -f compose.yaml -f compose.codex.yaml build collector
      - run: docker compose -f compose.yaml -f compose.codex.yaml up -d --wait
      - run: docker compose -f compose.yaml -f compose.codex.yaml exec -T collector codex --version
      - run: docker compose -f compose.yaml -f compose.codex.yaml exec -T collector python3 smoke_rpc.py
      - if: always()
        run: docker compose -f compose.yaml -f compose.codex.yaml down -v
